
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{% block title %}Hotel Management System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <style>
        body {
            background-color: #F8F6F2;
            color: #2E2E2E;
        }
        .navbar {
            background-color: #1F3A44 !important;
        }
        .navbar-brand {
            color: #C6A75E !important;
            font-weight: 700;
        }
        .nav-link {
            color: #ffffff !important;
        }
        .nav-link:hover {
            color: #C6A75E !important;
        }
        .btn-primary {
            background-color: #1F3A44;
            border-color: #1F3A44;
        }
        .btn-primary:hover {
            background-color: #C6A75E;
            border-color: #C6A75E;
        }
        .card {
            background-color: #FFFFFF;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .table thead {
            background-color: #1F3A44;
            color: #170000;
        }
        .table thead th {
            color: #100000;
        }
        .page-title {
            color: #1F3A44;
            font-weight: 700;
        }

        /* ── CHATBOT STYLES ── */
        #mosha-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1F3A44, #C6A75E);
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(31,58,68,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            z-index: 9999;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        #mosha-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 28px rgba(198,167,94,0.6);
        }
        #mosha-chatbot {
            position: fixed;
            bottom: 104px;
            right: 30px;
            width: 370px;
            max-height: 560px;
            background: #1F3A44;
            border: 1px solid #C6A75E;
            border-radius: 16px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 9998;
            box-shadow: 0 8px 40px rgba(0,0,0,0.3);
        }
        #mosha-chatbot.open {
            display: flex;
            animation: slideUp 0.25s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        #mosha-header {
            background: #162d36;
            padding: 13px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(198,167,94,0.4);
            flex-shrink: 0;
        }
        .mosha-title {
            display: flex;
            align-items: center;
            gap: 9px;
            color: #C6A75E;
            font-weight: 700;
            font-size: 14px;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            animation: pulse 1.6s infinite;
        }
        @keyframes pulse {
            0%,100% { opacity:1; }
            50%      { opacity:0.3; }
        }
        #mosha-close {
            background: none;
            border: none;
            color: #aaa;
            font-size: 17px;
            cursor: pointer;
            transition: color 0.2s;
        }
        #mosha-close:hover { color: #C6A75E; }
        #mosha-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scrollbar-width: thin;
            scrollbar-color: #C6A75E transparent;
        }
        .msg-bubble {
            max-width: 88%;
            padding: 9px 13px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .msg-user {
            background: #C6A75E;
            color: #1F3A44;
            align-self: flex-end;
            font-weight: 600;
            border-bottom-right-radius: 4px;
        }
        .msg-bot {
            background: #162d36;
            color: #F0EDE8;
            border: 1px solid rgba(198,167,94,0.25);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .msg-bot.error { border-color: #E53935; color: #ef9a9a; }
        .typing-dots {
            display: flex;
            gap: 5px;
            padding: 10px 13px;
            align-items: center;
        }
        .typing-dots span {
            width: 7px; height: 7px;
            background: #C6A75E;
            border-radius: 50%;
            opacity: 0.7;
            animation: bounce 1.2s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%,80%,100% { transform: translateY(0); }
            40%          { transform: translateY(-7px); }
        }
        #mosha-chips {
            padding: 4px 12px 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            flex-shrink: 0;
        }
        .chip {
            background: rgba(198,167,94,0.12);
            border: 1px solid rgba(198,167,94,0.35);
            color: #C6A75E;
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .chip:hover { background: rgba(198,167,94,0.28); }
        #mosha-input-area {
            padding: 10px 12px;
            border-top: 1px solid rgba(198,167,94,0.2);
            display: flex;
            gap: 7px;
            background: #162d36;
            flex-shrink: 0;
        }
        #mosha-input {
            flex: 1;
            background: #1F3A44;
            border: 1px solid rgba(198,167,94,0.3);
            border-radius: 8px;
            color: #F0EDE8;
            padding: 8px 12px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        #mosha-input:focus { border-color: #C6A75E; }
        #mosha-input::placeholder { color: #7a9aa8; }
        #mosha-send {
            background: #C6A75E;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            color: #1F3A44;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            transition: opacity 0.2s;
        }
        #mosha-send:hover { opacity: 0.85; }
        #mosha-send:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">🏨 Mosha Hotel MS</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'guest_list' %}">Guests</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Rooms</a>
                </li>
                <li class="nav-item">
                   <a class="nav-link" href="{% url 'payment_list' %}">Payments</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'report' %}">Reports</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<!-- ── MOSHA CHATBOT WIDGET ── -->
<button id="mosha-toggle" title="Staff Assistant">
    <i class="fas fa-concierge-bell"></i>
</button>

<div id="mosha-chatbot">
    <div id="mosha-header">
        <div class="mosha-title">
            <span class="live-dot"></span>
            <i class="fas fa-hotel"></i>
            Mosha HMS — Staff Assistant
        </div>
        <button id="mosha-close">✕</button>
    </div>
    <div id="mosha-messages"></div>
    <div id="mosha-chips">
        <span class="chip" onclick="sendChip('vacant rooms')">🛏️ Vacant</span>
        <span class="chip" onclick="sendChip('occupied rooms')">🔴 Occupied</span>
        <span class="chip" onclick="sendChip('all guests')">👥 Guests</span>
        <span class="chip" onclick="sendChip('revenue today')">💰 Revenue</span>
        <span class="chip" onclick="sendChip('recent payments')">💳 Payments</span>
        <span class="chip" onclick="sendChip('help')">❓ Help</span>
    </div>
    <div id="mosha-input-area">
        <input type="text" id="mosha-input"
               placeholder="e.g. 'vacant rooms', 'guest Nakato'..."
               autocomplete="off"/>
        <button id="mosha-send"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>
<!-- ── END CHATBOT ── -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const CHATBOT_URL = "{% url 'chatbot' %}";
    const toggle   = document.getElementById('mosha-toggle');
    const chatbox  = document.getElementById('mosha-chatbot');
    const closeBtn = document.getElementById('mosha-close');
    const input    = document.getElementById('mosha-input');
    const sendBtn  = document.getElementById('mosha-send');
    const messages = document.getElementById('mosha-messages');
    let isOpen = false;

    toggle.addEventListener('click', () => {
        isOpen = !isOpen;
        chatbox.classList.toggle('open', isOpen);
        if (isOpen && messages.children.length === 0) {
            addBot("👋 Hello! I'm the Mosha HMS Staff Assistant.\n\nAsk me about rooms, guests, or payments.\nType 'help' to see everything I can do.");
        }
        if (isOpen) input.focus();
    });
    closeBtn.addEventListener('click', () => {
        isOpen = false;
        chatbox.classList.remove('open');
    });
    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
    function sendChip(text) { input.value = text; send(); }

    async function send() {
        const text = input.value.trim();
        if (!text) return;
        addUser(text);
        input.value = '';
        sendBtn.disabled = true;
        const typingId = addTyping();
        try {
            const res  = await fetch(CHATBOT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            removeTyping(typingId);
            addBot(data.reply || 'No response received.');
        } catch {
            removeTyping(typingId);
            addBot('⚠️ Could not reach the server. Is Django running?', true);
        }
        sendBtn.disabled = false;
        input.focus();
    }
    function addUser(text) {
        const d = document.createElement('div');
        d.className = 'msg-bubble msg-user';
        d.textContent = text;
        messages.appendChild(d);
        scroll();
    }
    function addBot(text, isError = false) {
        const d = document.createElement('div');
        d.className = 'msg-bubble msg-bot' + (isError ? ' error' : '');
        d.textContent = text;
        messages.appendChild(d);
        scroll();
    }
    function addTyping() {
        const d = document.createElement('div');
        d.className = 'msg-bubble msg-bot typing-dots';
        d.innerHTML = '<span></span><span></span><span></span>';
        const id = 'typing-' + Date.now();
        d.id = id;
        messages.appendChild(d);
        scroll();
        return id;
    }
    function removeTyping(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }
    function scroll() { messages.scrollTop = messages.scrollHeight; }
</script>
</body>
</html>
