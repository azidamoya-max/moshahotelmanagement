{% load static %}
{% load crispy_forms_tags %}

<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="author" content="Azida">
	<meta name="description" content="Signup page for user registration">
	<meta name="keywords" content="signup, registration, user">

	<!-- TailwindCSS -->
	<link href="{% static 'css/output.css' %}" rel="stylesheet">
	<!-- Font Awesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />

	<title>Signup</title>
</head>

<body class="bg-gray-100 flex flex-col min-h-screen">

	<!-- Header -->
	<header class="flex justify-between items-center" style="background-color: #a6aebf;">
		<!-- Site Title -->
		<h1 class="text-white text-2xl font-bold px-6 py-4">User Registration</h1>

		<!-- Login/Logout Buttons -->
		<div class="flex items-center space-x-4 px-6">
			{% if request.user.is_authenticated %}
			<a href="">
				<button type="button" class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 transition duration-150">
					Logout
				</button>
			</a>
			{% else %}
			<a href="">
				<button type="button" class="px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-600 transition duration-150">
					Login
				</button>
			</a>
			{% endif %}
		</div>
	</header>

	<!-- Main Content Section -->
	<main class="flex-grow flex justify-center items-center py-12">
		<div class="w-full max-w-md bg-white rounded-lg shadow-md px-8 py-8" style="border: 1px solid #a6aebf;">
			<!-- Form Heading -->
			<h2 class="text-center text-2xl font-semibold mb-6" style="color: #a6aebf;">Create an Account</h2>

			<!-- Form Start -->
			<form method="post" novalidate>
				{% csrf_token %}
				<div class="mb-4">
					{{ form|crispy }}
				</div>

				<!-- Submit Button -->
				<button type="submit"
					class="w-full py-2 font-semibold rounded-lg text-white transition duration-150"
					style="background-color: #a6aebf; hover:bg-opacity-80;">
					Signup
				</button>
			</form>
		</div>
	</main>

	<!-- Footer -->
	<footer class="text-white text-center py-4" style="background-color: #a6aebf;">
		<p>&copy; 2026 AZIDA. All Rights Reserved.</p>
	</footer>


<footer style="background-color: #142a68; color: #ffffff; text-align: center; padding: 16px; margin-top: auto; font-size: 0.875rem; width: 100%;">
    &copy; 2026 ParkEase. All rights reserved. Developed by Aisha.
</footer>
</body>

</html>
