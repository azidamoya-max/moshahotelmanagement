<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Battery | ParkEase</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Poppins", sans-serif; background: #eaecf5; min-height: 100vh; display: flex; flex-direction: column; }
    .navbar { background-color: #142a68; padding: 14px 36px; display: flex; align-items: center; }
    .navbar-brand { color: white; font-size: 1.25rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2.5px; }
    .navbar-nav { margin-left: auto; display: flex; gap: 1.5rem; list-style: none; }
    .nav-link { color: white; font-weight: 500; text-decoration: none; font-size: 0.88rem; }
    .nav-link:hover { color: #dfe4ea; }
    .container { width: 50%; margin: 3rem auto; background: #fff; border-radius: 12px; padding: 2rem; box-shadow: 0 4px 24px rgba(26,36,89,0.10); }
    h1 { font-size: 1.5rem; font-weight: 800; color: #1a2459; margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #374151; margin-bottom: 4px; margin-top: 12px; }
    input, select { width: 100%; padding: 10px 14px; border: 1.5px solid #d1d5e8; border-radius: 8px; font-size: 0.88rem; outline: none; font-family: inherit; }
    input:focus, select:focus { border-color: #142a68; }
    .btn-save { background: #142a68; color: #fff; border: none; border-radius: 8px; padding: 10px 28px; font-size: 0.9rem; font-weight: 700; cursor: pointer; margin-top: 20px; }
    .btn-save:hover { background: #0f1e4a; }
    .btn-cancel { background: #fff; color: #6b7280; border: 1.5px solid #d1d5e8; border-radius: 8px; padding: 10px 20px; font-size: 0.9rem; font-weight: 600; cursor: pointer; margin-top: 20px; margin-left: 10px; text-decoration: none; display: inline-block; }
    footer { background-color: #142a68; padding: 12px; text-align: center; color: rgba(255,255,255,0.7); font-size: 0.85rem; margin-top: auto; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">PARKEASE RESOURCES</div>
    <ul class="navbar-nav">
      <li><a class="nav-link" href="/director">Parking</a></li>
      <li><a class="nav-link" href="/manager-battery/">Battery Corner</a></li>
      <li><a class="nav-link" href="/manager-tyre/">Tyre Corner</a></li>
      <li><a class="nav-link" href="/reports">📊 Reports</a></li>
      <li><a class="nav-link" href="/logout">Logout</a></li>
    </ul>
  </nav>
  <div class="container">
    <h1>Edit Battery Record</h1>
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-save">Save Changes</button>
      <a href="/manager-battery/" class="btn-cancel">Cancel</a>
    </form>
  </div>
  <footer>© 2026 ParkEase. All rights reserved. Developed by Aisha.</footer>
</body>
</html>
<!-- ===== battery_edit END ===== -->
